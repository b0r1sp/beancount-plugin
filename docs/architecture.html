<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the Beancount plugin works</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · beancount-plugin</p>
    <h1>How the Beancount plugin works</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">How the Beancount plugin works</title>
        <desc id="architecture-desc">Claude, guided by the plugin's slash commands and skill, translates the user's request into MCP tool calls; on the user's computer the beancount-mcp server writes the book's text files, Beancount, which the plugin installs, validates and queries them, git commits each change, and reports are rendered from Beancount's results.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: the user's computer -->
        <rect x="420" y="64" width="504" height="412" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="456" y="68" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="536" y="77" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR COMPUTER · DETERMINISTIC</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- You -> Claude -->
        <line x1="160" y1="144" x2="198" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="168" y="124" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="180" y="133" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ASK</text>

        <!-- Claude -> MCP: tool call -->
        <line x1="376" y1="132" x2="450" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="384" y="112" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="414" y="121" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text>

        <!-- MCP -> Claude: result (dashed return) -->
        <line x1="452" y1="156" x2="378" y2="156" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="392" y="164" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="414" y="173" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>

        <!-- MCP -> Beancount: validate (headline path) -->
        <line x1="636" y1="144" x2="702" y2="144" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="644" y="124" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="670" y="133" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATE</text>

        <!-- MCP -> Book: write -->
        <line x1="544" y1="180" x2="544" y2="258" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="552" y="214" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="570" y="223" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

        <!-- Book -> Beancount: parse -->
        <path d="M 636,292 H 788 Q 796,292 796,284 V 182" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="694" y="272" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="712" y="281" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PARSE</text>

        <!-- Beancount -> Reports: render -->
        <line x1="848" y1="180" x2="848" y2="386" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="856" y="326" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="876" y="335" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RENDER</text>

        <!-- Book -> git: commit -->
        <line x1="544" y1="324" x2="544" y2="386" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="552" y="348" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="572" y="357" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COMMIT</text>

        <!-- Commands + skill -> Claude: guides -->
        <line x1="288" y1="300" x2="288" y2="186" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="296" y="236" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="316" y="245" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GUIDES</text>

        <!-- Nodes -->
        <!-- You (input) -->
        <rect x="40" y="116" width="120" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="116" width="120" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="122" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="64" y="131" fill="rgba(90,101,128,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="100" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">You</text>
        <text x="100" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">words · files</text>

        <!-- Claude (external, LLM) -->
        <rect x="200" y="104" width="176" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="104" width="176" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="208" y="110" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="222" y="119" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
        <text x="288" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Claude</text>
        <text x="288" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">translator</text>

        <!-- beancount-mcp (backend) -->
        <rect x="452" y="108" width="184" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="452" y="108" width="184" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="460" y="114" width="116" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="518" y="123" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MCP · FROM THIS PLUGIN</text>
        <text x="544" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">beancount-mcp</text>
        <text x="544" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">19 tools · uv run</text>

        <!-- Beancount (focal) -->
        <rect x="704" y="108" width="184" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="108" width="184" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="712" y="114" width="156" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="790" y="123" fill="rgba(191,69,32,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE · INSTALLED BY THIS PLUGIN</text>
        <text x="796" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Beancount</text>
        <text x="796" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">bean-check · bean-query</text>

        <!-- Book directory (store) -->
        <rect x="452" y="260" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="452" y="260" width="184" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="460" y="266" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="478" y="275" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FILES</text>
        <text x="544" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Book directory</text>
        <text x="544" y="313" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">*.beancount · plain text</text>

        <!-- git (store) -->
        <rect x="452" y="388" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="452" y="388" width="184" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="460" y="394" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="480" y="403" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HISTORY</text>
        <text x="544" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">git</text>
        <text x="544" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one commit per change</text>

        <!-- Reports (backend) -->
        <rect x="704" y="388" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="388" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="712" y="394" width="88" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="756" y="403" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FROM THIS PLUGIN</text>
        <text x="796" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Reports</text>
        <text x="796" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">HTML · Excel</text>

        <!-- Commands + skill (from this plugin) -->
        <rect x="188" y="300" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="188" y="300" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="196" y="306" width="88" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="240" y="315" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FROM THIS PLUGIN</text>
        <text x="288" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Commands &amp; skill</text>
        <text x="288" y="353" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/beancount:* · accounting rules</text>

        <!-- Editorial callout -->
        <text x="288" y="404" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">Claude proposes.</text>
        <text x="288" y="424" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">Beancount decides.</text>

        <!-- Legend -->
        <line x1="30" y1="532" x2="930" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="120" y="550" width="20" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="148" y="560" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Deterministic core</text>

        <rect x="280" y="550" width="20" height="14" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="308" y="560" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Language model</text>

        <rect x="432" y="550" width="20" height="14" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="460" y="560" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Data on disk</text>

        <line x1="568" y1="557" x2="596" y2="557" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="604" y="560" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Call / data flow</text>

        <line x1="712" y1="557" x2="740" y2="557" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="748" y="560" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Return value</text>
      </svg>
    </div>
  </div>
</body>
</html>
